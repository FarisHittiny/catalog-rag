[project]
name = "catalog-rag"
version = "0.1.0"
description = "Eval-driven RAG over the Texas A&M course catalog"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "networkx>=3.3",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "anthropic>=0.30",
    "openai>=1.30",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_rag"]

[tool.ruff]
line-length = 100

# Linux (CI, the Docker Space) gets CPU-only torch: the PyPI wheel drags in ~3 GB of CUDA libraries
# the demo never uses. Windows/macOS keep the default index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
